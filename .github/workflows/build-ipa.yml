name: Build Safe Standalone Flydigi IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Self-Contained iOS ARM64 IPA Directly (Zero XcodeGen/Xcodebuild Error 74)
        run: |
          set -e
          mkdir -p BuildSrc
          mkdir -p Payload/FlydigiPlayTogetherMapper.app

          echo "" | base64 --decode | gunzip > Payload/FlydigiPlayTogetherMapper.app/Info.plist
          echo "" | base64 --decode | gunzip > BuildSrc/App.swift

          echo -n "APPL????" > Payload/FlydigiPlayTogetherMapper.app/PkgInfo
          plutil -lint Payload/FlydigiPlayTogetherMapper.app/Info.plist

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK: $SDK_PATH"

          xcrun -sdk iphoneos swiftc \
            -parse-as-library \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -O \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework GameController \
            -framework CoreBluetooth \
            -framework AVFoundation \
            -framework AVKit \
            BuildSrc/App.swift \
            -o Payload/FlydigiPlayTogetherMapper.app/FlydigiPlayTogetherMapper

          chmod +x Payload/FlydigiPlayTogetherMapper.app/FlydigiPlayTogetherMapper
          codesign --force --sign - --timestamp=none Payload/FlydigiPlayTogetherMapper.app

          zip -r9 FlydigiPlayTogetherMapper.ipa Payload
          ls -lh FlydigiPlayTogetherMapper.ipa

      - name: Upload Safe Standalone IPA for ESign
        uses: actions/upload-artifact@v4
        with:
          name: Flydigi-PlayTogether-Safe-IPA
          path: FlydigiPlayTogetherMapper.ipa
